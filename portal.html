<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal | Dayton Family Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="content-card" style="margin-top:24px;">
      <h1 class="page-title">Patient Portal</h1>
      <p style="text-align:center;">Sign in to view messages, appointments, and records. This is a demonstration login only.</p>
      <form class="form" id="portal-form">
        <label>Email <input type="email" required></label>
        <label>Password <input type="password" required></label>
        <button class="btn" type="submit">Sign In</button>
        <div class="toast" id="portal-toast">Portal access is not connected in this demo. Please call (937) 254-5661 for assistance.</div>
      </form>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("portal-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("portal-toast").style.display = "block";
    });
  </script>
</body>
</html>
