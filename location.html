<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hours &amp; Location | Dayton Family Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="content-card" style="margin-top:24px;">
      <h1 class="page-title">Office Location and Hours</h1>
      <div class="location-grid">
        <a class="map-frame" href="https://www.google.com/maps/search/?api=1&query=3328+S+Smithville+Road+Dayton+OH+45420" target="_blank" rel="noopener">
          <img src="img/office.jpg" alt="Dayton Family Practice office">
          <span class="map-cta">Open map &amp; directions</span>
        </a>
        <div>
          <h3>Business Address</h3>
          <p>Dayton Family Practice<br>3328 South Smithville Rd<br>Dayton, Ohio 45420</p>
          <h3>Contact Numbers</h3>
          <p>Phone: (937) 254-5661<br>Fax: (937) 254-7367</p>
          <div class="hours">
            <div class="hours-title">Office Hours</div>
            <table>
              <tr><td>Mon - Thur</td><td>10:30 - 10pm</td></tr>
              <tr><td>Friday</td><td>7:30am - 4pm</td></tr>
              <tr><td>Saturday</td><td>8:30am - 12pm</td></tr>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
